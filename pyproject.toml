[project]
name = "langchain-docs-practice"
version = "0.1.0"
description = "langchain-docs-practice"
readme = "README.md"
authors = [
    { name = "sivahere4cloud", email = "sivaganeshcloud@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.9",
    "langchain-google-genai>=4.4.3",
    "python-dotenv>=1.2.4",
    "truststore>=0.10.5",
]

[project.scripts]
langchain-docs-practice = "langchain_docs_practice:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
